# Linux and macOS release files (Windows: windows/build.ps1).
# The tablet binaries come from the draft release v<version> (built with ./build.sh, which needs the local SDK);
# the release files are uploaded back to that draft release. Publishing the release is done by hand.
name: build

on:
  push:
    branches: [unix-builds]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYSIDE6: "6.12.0"
  PILLOW: "12.1.1"
  PYINSTALLER: "6.19.0"
  NFPM: "2.41.1"

jobs:
  tablet:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rmpp_ctl.py)" >> "$GITHUB_OUTPUT"
      - name: Tablet binaries from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ steps.v.outputs.version }}" -R "$GITHUB_REPOSITORY" \
            --pattern librmpp-remote.so --pattern rmpp-remote --dir build
          file build/*
      - uses: actions/upload-artifact@v5
        with:
          name: tablet
          path: build/

  linux:
    needs: tablet
    runs-on: ubuntu-24.04
    # glibc 2.34 (what the PySide6 wheels need): Ubuntu 22.04+, Debian 12+, Fedora, RHEL 9, openSUSE, Arch, ...
    # (AlmaLinux 9: its python3.12 has the shared libpython PyInstaller needs; manylinux's Pythons do not)
    container: almalinux:9
    env:
      PYTHON: python3.12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: tablet
          path: build
      - name: Build tools and the libraries Qt's X11 / Wayland plugins load (bundled into the app)
        run: |
          dnf install -y -q epel-release
          dnf install -y -q python3.12 python3.12-pip tar gzip findutils binutils
          dnf install -y -q xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil \
            libxkbcommon-x11 libxkbcommon fontconfig freetype mesa-libGL mesa-libEGL dbus-libs \
            libwayland-client libwayland-cursor libwayland-egl file
          $PYTHON -m pip install -q "PySide6==$PYSIDE6" "pillow==$PILLOW" "pyinstaller==$PYINSTALLER"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM/nfpm_${NFPM}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - run: sh unix/build.sh
      - run: sh unix/package-linux.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/release/

  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "debian:13", kind: deb }
          - { image: "fedora:43", kind: rpm-dnf }
          - { image: "rockylinux/rockylinux:9", kind: rpm-dnf }
          - { image: "opensuse/tumbleweed", kind: rpm-zypper }
          - { image: "opensuse/leap:15.6", kind: rpm-zypper }
          - { image: "archlinux:latest", kind: tar }
          - { image: "archlinux:latest", kind: appimage }
          - { image: "ubuntu:24.04", kind: appimage }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - if: startsWith(matrix.image, 'opensuse')
        run: zypper -n install -y tar gzip   # for actions/checkout
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: linux
          path: release
      - run: sh unix/smoke-test.sh ${{ matrix.kind }} release
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-${{ strategy.job-index }}
          path: smoke-*.png
          if-no-files-found: ignore

  macos:
    needs: tablet
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: tablet
          path: build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q "PySide6==$PYSIDE6" "pillow==$PILLOW" "pyinstaller==$PYINSTALLER"
      - run: PYTHON=python sh unix/build.sh
      - run: sh unix/package-macos.sh
      - name: Smoke test (the app starts and keeps running)
        run: |
          dist/rmpp-studio.app/Contents/MacOS/rmpp-studio > studio.log 2>&1 &
          PID=$!
          sleep 15
          kill -0 $PID
          kill $PID
          cat studio.log
          dist/rmpp-ctl/rmpp-ctl -h | head -3
      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.runner }}
          path: dist/release/

  upload:
    needs: [tablet, linux, linux-test, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: "{linux,macos-*}"
          merge-multiple: true
      - name: Upload to the draft release (never to a published one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tablet.outputs.version }}
        run: |
          ls -la artifacts
          [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] \
            || { echo "$TAG is not a draft: not uploading"; exit 0; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber artifacts/*
