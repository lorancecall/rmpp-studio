# deb and rpm for unix/package-linux.sh (run from the repository root; VERSION comes from the environment)
name: rmpp-studio
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: video
priority: optional
maintainer: lorancecall <84116812+lorancecall@users.noreply.github.com>
description: |
  Record, edit and export reMarkable Paper Pro tutorials.
  rmpp-studio (GUI) and rmpp-ctl (command line); self-contained, Python and Qt included.
vendor: lorancecall
homepage: https://github.com/lorancecall/rmpp-studio
license: GPL-3.0-only

contents:
  - src: dist/rmpp-studio
    dst: /opt/rmpp-studio/app
  - src: dist/rmpp-ctl
    dst: /opt/rmpp-studio/cli
  - src: /opt/rmpp-studio/app/rmpp-studio
    dst: /usr/bin/rmpp-studio
    type: symlink
  - src: /opt/rmpp-studio/cli/rmpp-ctl
    dst: /usr/bin/rmpp-ctl
    type: symlink
  - src: unix/rmpp-studio.desktop
    dst: /usr/share/applications/rmpp-studio.desktop
  - src: build/linux-stage/icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/rmpp-studio.png
  - src: build/linux-stage/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/rmpp-studio.png
  - src: build/linux-stage/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/rmpp-studio.png
  - src: build/linux-stage/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/rmpp-studio.png
  - src: LICENSE
    dst: /usr/share/doc/rmpp-studio/LICENSE

# Qt's own libraries are bundled; these are the desktop libraries Qt loads from the system
overrides:
  deb:
    depends:
      - libgl1
      - libegl1
      - libfontconfig1
      - libfreetype6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libdbus-1-3
      - openssh-client
    recommends:
      - ffmpeg
  rpm:
    depends:
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libdbus-1.so.3()(64bit)
      - /usr/bin/ssh
    recommends:
      - ffmpeg
