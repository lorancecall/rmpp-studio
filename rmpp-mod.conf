# rmpp-mod.conf: how the rmpp installer lists and installs this mod (rmpp-studio's tablet part).
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-remote
type=release
default=0
needs=rmpp-preload
assets=librmpp-remote.so rmpp-remote rmpp-install.sh
check=test -e /usr/lib/rmpp/preload.d/40-rmpp-remote.so -o -e /usr/lib/rmpp-preload.d/40-rmpp-remote.so
short_ko=rmpp-studio 원격 제어
short_en=Remote control for rmpp-studio
detail_ko=PC의 rmpp-studio에서 화면 보기·탭·펜·키보드 입력·녹화를 합니다.|튜토리얼 녹화와 원격 조작용 (rmpp-studio의 Tablet > Install과 같음).|GitHub 릴리스에서 설치 (약 0.2 MB).
detail_en=Lets rmpp-studio on your computer show the screen, tap, draw,|type and record tutorials (= rmpp-studio's Tablet > Install).|From its GitHub release (~0.2 MB).
